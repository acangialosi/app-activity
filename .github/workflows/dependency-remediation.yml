name: Dependency remediation

# Turns the Security workflow's dependency findings for the default branch into one tracked issue
# and assigns it to Copilot cloud agent. It only reads validated JSON artifacts; it never runs PR code.
on:
  workflow_run:
    workflows: [Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  remediate:
    # Manual runs only execute the default branch's reviewed code, which can use the agent token.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request')
      || (github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Process every audit in order; runs for an outdated default-branch commit change nothing.
    # The feedback workflow shares this queue, so fix requests are never posted concurrently.
    concurrency:
      group: dependency-remediation
      queue: max
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Track dependency findings and assign Copilot cloud agent
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_REMEDIATION_TOKEN: ${{ secrets.COPILOT_REMEDIATION_TOKEN }}
        run: python -m tools.dependency_remediation remediate
