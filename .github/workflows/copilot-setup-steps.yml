name: Copilot Setup Steps

# Prepares Copilot cloud agent's Ubuntu environment. App Activity is a Windows app, so only its
# platform-independent tests run on Linux; the Windows CI checks stay authoritative for every change.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  # Copilot cloud agent only runs a job with this exact name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned pip-audit for quick dependency checks
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --requirement requirements-security.txt
