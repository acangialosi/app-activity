name: Update Gitleaks

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read

concurrency:
  group: update-gitleaks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Check official stable release and verify both Windows downloads
        run: python tools/update_gitleaks.py
      - name: Propose a reviewed update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/security_check.py; then
            echo "No Gitleaks update needed."
            exit 0
          fi
          version="$(python -c 'from tools.security_check import GITLEAKS_VERSION; print(GITLEAKS_VERSION)')"
          branch="automation/gitleaks-$version"
          existing="$(gh pr list --state all --head "$branch" --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "An update PR for $version already exists (possibly closed); not replacing it."
            exit 0
          fi
          if [ -n "$(gh api "repos/$GH_REPO/git/matching-refs/heads/$branch" --jq ".[] | select(.ref == \"refs/heads/$branch\") | .ref")" ]; then
            echo "::error::An update branch already exists without a PR. Inspect it before retrying."
            exit 1
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/security_check.py
          git commit -m "Update Gitleaks to $version"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Update Gitleaks to $version" \
            --body "Updates the pinned Gitleaks release and SHA-256 checksums for Windows x64 and ARM64. Both archives were downloaded and checked against the official release checksums; no downloaded binaries ran in the updater job.

          Review the release notes at https://github.com/gitleaks/gitleaks/releases/tag/v$version and the pin changes. Approve workflows to run if GitHub requests it, then wait for all required checks before merging. This job never approves or merges PRs.

          After merging and syncing, the next local secret scan installs this checksum-verified version automatically. No update is installed directly from an unreviewed upstream latest release."
