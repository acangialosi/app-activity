name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Prepare signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ env.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "app-activity-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "SIGNING_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "SIGNING_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Build installer
        shell: powershell
        run: .\build.ps1

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AppActivity-Windows-Installer
          path: artifacts/AppActivity-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts\AppActivity-Setup.exe"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $installer --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          }

      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "nightly"
          $installer = "artifacts\AppActivity-Setup.exe"
          $title = "Latest development build"
          $notes = "Automated installer for commit $env:GITHUB_SHA on main."

          git tag --force $release $env:GITHUB_SHA
          git push origin "refs/tags/$release" --force

          $releases = @(
            gh release list --limit 100 --json tagName | ConvertFrom-Json
          )
          if ($releases.tagName -contains $release) {
            gh release upload $release $installer --clobber
            gh release edit $release `
              --prerelease `
              --title $title `
              --notes $notes
          } else {
            gh release create $release $installer `
              --verify-tag `
              --prerelease `
              --title $title `
              --notes $notes
          }
