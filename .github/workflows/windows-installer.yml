name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  # Builds and smoke-tests every change unsigned. This job never has signing access or write
  # access; trusted main and tag builds hand the unsigned app to the separate sign job.
  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TRUSTED_BUILD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: powershell
        run: .\build.ps1

      - name: Smoke test packaged MCP server
        shell: powershell
        run: python tools\mcp_smoke_test.py dist\AppActivity\AppActivity.exe mcp

      - name: Upload unsigned application for signing
        if: env.TRUSTED_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppActivity-Unsigned-Build
          path: |
            dist/AppActivity
            artifacts/AppActivity-update.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned installer
        if: github.event_name == 'workflow_dispatch' && env.TRUSTED_BUILD != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppActivity-Windows-Installer
          path: |
            artifacts/AppActivity-Setup.exe
            artifacts/AppActivity-update.json
          if-no-files-found: error
          retention-days: 1

  # Signs trusted main and tag builds with Azure Artifact Signing. Only this job can request an
  # OIDC token, and only in the "signing" environment, whose deployment policy allows main and
  # v* tags; Azure trusts only that environment's token. Until the ARTIFACT_SIGNING_* and AZURE_*
  # variables are configured, it packages the installer unsigned so nightly builds still publish.
  sign:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read
      id-token: write
    env:
      SIGNING_CONFIGURED: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.ARTIFACT_SIGNING_ENDPOINT != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AppActivity-Unsigned-Build

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Report missing signing configuration
        if: env.SIGNING_CONFIGURED != 'true'
        shell: powershell
        run: |
          "::warning::Azure Artifact Signing is not configured; publishing an unsigned installer. See README 'Signing the installer'."

      - name: Azure login
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\AppActivity\AppActivity.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer
        shell: powershell
        run: .\build.ps1 -Stage Installer

      - name: Sign installer
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\AppActivity-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        if: env.SIGNING_CONFIGURED == 'true'
        shell: powershell
        run: |
          foreach ($file in "dist\AppActivity\AppActivity.exe", "artifacts\AppActivity-Setup.exe") {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
              throw "$file is not validly signed and timestamped: $($signature.Status) $($signature.StatusMessage)"
            }
            "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppActivity-Windows-Installer
          path: |
            artifacts/AppActivity-Setup.exe
            artifacts/AppActivity-update.json
          if-no-files-found: error
          retention-days: 1

  # The only job with write access. It runs no build code: it publishes the installer that the
  # sign job produced for a pushed tag or for main.
  publish:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AppActivity-Windows-Installer
          path: artifacts

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts\AppActivity-Setup.exe"
          $metadata = "artifacts\AppActivity-update.json"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $installer $metadata --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer $metadata `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          }

      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "nightly"
          $installer = "artifacts\AppActivity-Setup.exe"
          $metadata = "artifacts\AppActivity-update.json"
          $title = "Latest development build"
          $notes = "Automated installer for commit $env:GITHUB_SHA on main."

          git tag --force $release $env:GITHUB_SHA
          git push origin "refs/tags/$release" --force

          $releases = @(
            gh release list --limit 100 --json tagName | ConvertFrom-Json
          )
          if ($releases.tagName -contains $release) {
            gh release upload $release $installer $metadata --clobber
            gh release edit $release `
              --prerelease `
              --title $title `
              --notes $notes
          } else {
            gh release create $release $installer $metadata `
              --verify-tag `
              --prerelease `
              --title $title `
              --notes $notes
          }