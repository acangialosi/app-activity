name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      ARTIFACT_SIGNING_ENABLED: ${{ vars.ARTIFACT_SIGNING_ENABLED }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Prepare signing certificate
        if: env.ARTIFACT_SIGNING_ENABLED != 'true' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ env.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "app-activity-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "SIGNING_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "SIGNING_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Build installer
        if: env.ARTIFACT_SIGNING_ENABLED != 'true'
        shell: powershell
        run: .\build.ps1

      - name: Build application for Artifact Signing
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        shell: powershell
        run: .\build.ps1 -SkipInstallerBuild -SkipCodeSigning

      - name: Log in to Azure
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application with Artifact Signing
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\AppActivity\AppActivity.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package signed application
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        shell: powershell
        run: .\build.ps1 -SkipDependencyInstall -SkipApplicationBuild -SkipCodeSigning

      - name: Sign installer with Artifact Signing
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\artifacts\AppActivity-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Artifact Signing signatures
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        shell: powershell
        run: |
          @(
            "dist\AppActivity\AppActivity.exe",
            "artifacts\AppActivity-Setup.exe"
          ) | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_
            if ($signature.Status -ne "Valid") {
              throw "$_ has invalid signature status: $($signature.Status)"
            }
            Write-Output "$_ signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Build unsigned pull request installer
        if: env.ARTIFACT_SIGNING_ENABLED == 'true' && github.event_name == 'pull_request'
        shell: powershell
        run: .\build.ps1 -SkipCodeSigning

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AppActivity-Windows-Installer
          path: artifacts/AppActivity-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts\AppActivity-Setup.exe"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $installer --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          }

      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "nightly"
          $installer = "artifacts\AppActivity-Setup.exe"
          $title = "Latest development build"
          $notes = "Automated installer for commit $env:GITHUB_SHA on main."

          git tag --force $release $env:GITHUB_SHA
          git push origin "refs/tags/$release" --force

          $releases = @(
            gh release list --limit 100 --json tagName | ConvertFrom-Json
          )
          if ($releases.tagName -contains $release) {
            gh release upload $release $installer --clobber
            gh release edit $release `
              --prerelease `
              --title $title `
              --notes $notes
          } else {
            gh release create $release $installer `
              --verify-tag `
              --prerelease `
              --title $title `
              --notes $notes
          }
