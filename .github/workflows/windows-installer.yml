name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  # Builds every change, but signs only trusted main and tag builds. Pull requests and other
  # branches (including agent branches) build unsigned, receive no signing secrets, and cannot
  # write to the repository; publishing happens in the separate publish job.
  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TRUSTED_BUILD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Prepare signing certificate
        if: env.TRUSTED_BUILD == 'true'
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            "No signing certificate is configured; building unsigned."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "app-activity-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "SIGNING_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "SIGNING_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Build installer
        shell: powershell
        run: .\build.ps1

      - name: Smoke test packaged MCP server
        shell: powershell
        run: python tools\mcp_smoke_test.py dist\AppActivity\AppActivity.exe mcp

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppActivity-Windows-Installer
          path: |
            artifacts/AppActivity-Setup.exe
            artifacts/AppActivity-update.json
          if-no-files-found: error
          retention-days: 1

  # The only job with write access. It runs no build code: it publishes the installer that the
  # build job produced for a pushed tag or for main.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AppActivity-Windows-Installer
          path: artifacts

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts\AppActivity-Setup.exe"
          $metadata = "artifacts\AppActivity-update.json"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $installer $metadata --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer $metadata `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          }

      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "nightly"
          $installer = "artifacts\AppActivity-Setup.exe"
          $metadata = "artifacts\AppActivity-update.json"
          $title = "Latest development build"
          $notes = "Automated installer for commit $env:GITHUB_SHA on main."

          git tag --force $release $env:GITHUB_SHA
          git push origin "refs/tags/$release" --force

          $releases = @(
            gh release list --limit 100 --json tagName | ConvertFrom-Json
          )
          if ($releases.tagName -contains $release) {
            gh release upload $release $installer $metadata --clobber
            gh release edit $release `
              --prerelease `
              --title $title `
              --notes $notes
          } else {
            gh release create $release $installer $metadata `
              --verify-tag `
              --prerelease `
              --title $title `
              --notes $notes
          }