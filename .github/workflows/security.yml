name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  security-secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install pinned secret scanner
        run: python tools/ci_security.py setup-secrets
      - name: Scan all available history
        run: python tools/ci_security.py secrets
      - name: Verify security gates with isolated fixtures
        run: python -m unittest discover -s tests -p test_ci_security.py -v

  security-dependencies:
    name: security-dependencies (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependency auditor
        run: python tools/ci_security.py setup-dependencies
      - name: Audit resolved build and security-tool dependencies
        run: python tools/ci_security.py dependencies
